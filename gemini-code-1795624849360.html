<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Հարկային Խաչբառ-Մրցույթ</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --card: #ffffff;
      --primary: #143d6b;
      --primary-2: #1f5c99;
      --accent: #d97706;
      --accent-soft: #fef3c7;
      --highlight: #dbeafe;
      --active-cell: #93c5fd;
      --correct: #dcfce7;
      --correct-border: #16a34a;
      --wrong: #fee2e2;
      --wrong-border: #dc2626;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --shadow: 0 10px 30px rgba(20, 61, 107, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Noto Sans Armenian", "DejaVu Sans", Arial, sans-serif;
      background: linear-gradient(135deg, #eef4fb 0%, #f8fafc 100%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      background: linear-gradient(120deg, var(--primary), var(--primary-2));
      color: #fff;
      border-radius: 18px;
      padding: 20px 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .brand h1 {
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand p {
      font-size: 0.92rem;
      opacity: 0.9;
      margin-top: 4px;
    }

    .nav-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
    }

    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.24);
    }

    .tab-btn.active {
      background: #fff;
      color: var(--primary);
      border-color: #fff;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 22px;
      box-shadow: var(--shadow);
      border: 1px solid #e2e8f0;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    /* Login Box */
    .login-box {
      max-width: 500px;
      margin: 24px auto;
      text-align: center;
    }

    .login-box h2 {
      color: var(--primary);
      margin-bottom: 8px;
      font-size: 1.35rem;
    }

    .login-box p {
      color: var(--muted);
      margin-bottom: 20px;
      font-size: 0.95rem;
    }

    .form-group {
      text-align: left;
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: 0.2s;
    }

    .form-group input:focus {
      border-color: var(--primary-2);
      box-shadow: 0 0 0 3px rgba(31, 92, 153, 0.14);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 18px;
      border-radius: 10px;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-2);
    }

    .btn-success {
      background: #15803d;
      color: #fff;
    }

    .btn-success:hover {
      background: #166534;
    }

    .btn-warning {
      background: var(--accent);
      color: #fff;
    }

    .btn-warning:hover {
      background: #b45309;
    }

    .btn-danger {
      background: #dc2626;
      color: #fff;
    }

    .btn-danger:hover {
      background: #b91c1c;
    }

    .btn-outline {
      background: #fff;
      color: var(--primary);
      border: 1.5px solid var(--border);
    }

    .btn-outline:hover {
      background: #f1f5f9;
    }

    .w-full {
      width: 100%;
    }

    /* Top bar inside game */
    .game-topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid #e2e8f0;
    }

    .student-badge {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .pill {
      background: #f1f5f9;
      color: var(--text);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .pill.timer {
      background: var(--accent-soft);
      color: #92400e;
      font-variant-numeric: tabular-nums;
    }

    .pill.score {
      background: #e0f2fe;
      color: #075985;
    }

    .active-clue-banner {
      background: #eff6ff;
      border-left: 5px solid var(--primary-2);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .clue-tag {
      background: var(--primary);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      margin-right: 8px;
    }

    .clue-text {
      font-weight: 600;
      font-size: 1rem;
      color: var(--text);
    }

    /* Main game grid layout */
    .game-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(300px, 0.85fr);
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 960px) {
      .game-layout {
        grid-template-columns: 1fr;
      }
    }

    .grid-wrapper {
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .crossword-grid {
      display: grid;
      gap: 3px;
      margin: 0 auto;
      width: max-content;
      background: #e2e8f0;
      padding: 8px;
      border-radius: 12px;
    }

    .cell {
      width: 34px;
      height: 34px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      user-select: none;
    }

    @media (max-width: 560px) {
      .cell {
        width: 27px;
        height: 27px;
      }
      .cell input {
        font-size: 0.92rem !important;
      }
      .cell-num {
        font-size: 0.58rem !important;
      }
    }

    .cell.empty {
      background: transparent;
    }

    .cell.active-cell-bg {
      background: #fff;
      border: 1.5px solid #94a3b8;
    }

    .cell.highlighted {
      background: var(--highlight) !important;
      border-color: var(--primary-2) !important;
    }

    .cell.focused {
      background: var(--active-cell) !important;
      border-color: var(--primary) !important;
    }

    .cell.correct {
      background: var(--correct) !important;
      border-color: var(--correct-border) !important;
    }

    .cell.wrong {
      background: var(--wrong) !important;
      border-color: var(--wrong-border) !important;
    }

    .cell-num {
      position: absolute;
      top: 1px;
      left: 2px;
      font-size: 0.66rem;
      font-weight: 700;
      color: var(--primary);
      line-height: 1;
      pointer-events: none;
      z-index: 2;
    }

    .cell input {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      font-family: inherit;
      text-transform: uppercase;
      outline: none;
      cursor: pointer;
    }

    .action-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .
